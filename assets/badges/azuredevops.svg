<svg xmlns="http://www.w3.org/2000/svg" width="57.5" height="28" viewBox="0 0 57.5 28">
  <defs>
    
    <linearGradient id="plastic-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.7" />
      <stop offset="5%" stop-color="#fff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
  </defs>
  
  <!-- Background Color -->
  <rect width="57.5" height="28" rx="4" fill="#0078D4" />
  
  <!-- Plastic Gradient Overlay -->
  <rect width="57.5" height="28" rx="4" fill="url(#plastic-gradient)" />
  
  <!-- Content with Shadow -->
  <g filter="url(#shadow)">
      
      <text x="28.75" y="18.0" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">Azure</text>
  </g>
</svg>